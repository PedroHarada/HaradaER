# Gera os executáveis e publica a versão quando uma etiqueta v* é enviada:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Em cada sistema: lint, testes e PyInstaller. Se algo falhar, a versão não é publicada.
# Etiquetas com hífen (v1.0.0-teste) saem como "pré-lançamento" e não apagam nada. Uma versão
# final substitui as anteriores: as páginas e arquivos antigos saem de Releases, mas as
# etiquetas do git ficam.
name: Versão

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # gera e testa os pacotes sem publicar nada (para conferir o workflow)

jobs:
  executaveis:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # glibc antiga: o executável roda no Ubuntu 22.04+, Arch, Fedora...
            sistema: linux
          - os: windows-latest
            sistema: windows
          - os: macos-14  # chip Apple (M1 em diante)
            sistema: macos
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      NOME: HaradaER-${{ github.ref_name }}-${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Bibliotecas do sistema que o Qt usa (Linux)
        if: matrix.sistema == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Instalar o HaradaER e o PyInstaller
        run: pip install ".[dev]" pyinstaller==6.22.3
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Testes
        run: pytest -q -rs
      - name: Gerar os ícones do Windows e do macOS
        run: python packaging/gerar_icones.py
      - name: Gerar o executável
        run: pyinstaller --noconfirm packaging/HaradaER.spec
      # Autoteste do executável pronto: abre uma janela, confere que o teclado virtual e os outros
      # módulos de fora não voltaram e que a conexão segura com o GitHub funciona com o OpenSSL
      # empacotado (src/haradaer/selftest.py).
      - name: Autoteste do executável (Linux)
        if: matrix.sistema == 'linux'
        run: |
          ./dist/HaradaER --autoteste autoteste.txt; codigo=$?
          cat autoteste.txt; exit $codigo
      - name: Autoteste do executável em outras distribuições (Linux)
        if: matrix.sistema == 'linux'
        # O executável é gerado no Ubuntu: a conexão segura falhou no Arch na 1.1.1.
        run: |
          testar() {
            docker run --rm -e QT_QPA_PLATFORM=offscreen -v "$PWD/dist:/haradaer" "$1" \
              sh -c "$2 >/dev/null && /haradaer/HaradaER --autoteste /tmp/a.txt; c=\$?; cat /tmp/a.txt; exit \$c"
          }
          echo "== Fedora"; testar fedora:41 "dnf -q -y install fontconfig libglvnd-egl libglvnd-opengl"
          echo "== Arch"; testar archlinux:latest "pacman -Sy --noconfirm --quiet fontconfig libglvnd"
      - name: Autoteste do executável (macOS)
        if: matrix.sistema == 'macos'
        run: |
          dist/HaradaER.app/Contents/MacOS/HaradaER --autoteste autoteste.txt; codigo=$?
          cat autoteste.txt; exit $codigo
      - name: Autoteste do executável (Windows)
        if: matrix.sistema == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/HaradaER.exe -ArgumentList '--autoteste','autoteste.txt' -Wait -PassThru
          Get-Content autoteste.txt
          exit $p.ExitCode
      - name: Empacotar (Linux)
        if: matrix.sistema == 'linux'
        run: |
          mkdir pacote && cp dist/HaradaER pacote/HaradaER && chmod +x pacote/HaradaER
          cp packaging/AVISOS-DE-LICENCA.txt packaging/linux/* src/haradaer/resources/haradaer.svg pacote/
          python packaging/manual_do_sistema.py linux pacote/PRIMEIROS-PASSOS.txt
          python packaging/manual_do_sistema.py linux pacote/GETTING-STARTED.txt en
          chmod +x pacote/instalar.sh
          tar -czf "$NOME.tar.gz" -C pacote .
      - name: Empacotar (Windows)
        if: matrix.sistema == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pacote | Out-Null
          Copy-Item dist/HaradaER.exe pacote/HaradaER.exe
          Copy-Item packaging/AVISOS-DE-LICENCA.txt pacote/
          python packaging/manual_do_sistema.py windows pacote/PRIMEIROS-PASSOS.txt
          python packaging/manual_do_sistema.py windows pacote/GETTING-STARTED.txt en
          Compress-Archive -Path pacote/* -DestinationPath "$env:NOME.zip"
      - name: Empacotar (macOS)
        if: matrix.sistema == 'macos'
        run: |
          mkdir pacote && cp -R dist/HaradaER.app pacote/ && cp packaging/AVISOS-DE-LICENCA.txt pacote/
          python packaging/manual_do_sistema.py macos pacote/PRIMEIROS-PASSOS.txt
          python packaging/manual_do_sistema.py macos pacote/GETTING-STARTED.txt en
          ditto -c -k pacote "$NOME.zip"  # sem a pasta pacote/ dentro do zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NOME }}
          path: |
            ${{ env.NOME }}.tar.gz
            ${{ env.NOME }}.zip
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/')  # pelo disparo manual, só gera e testa
    needs: executaveis
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: arquivos
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: HaradaER ${{ github.ref_name }}
          body_path: packaging/NOTAS-DA-VERSAO.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: arquivos/*
      - name: Tirar as versões anteriores (fica só a nova; as etiquetas do git ficam)
        # Só numa versão final: uma pré-versão não apaga a final, que o aviso de versão nova lê.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep -v -x -F "${{ github.ref_name }}" |
            while read -r etiqueta; do
              echo "Tirando a versão $etiqueta"
              gh release delete "$etiqueta" --yes
            done
