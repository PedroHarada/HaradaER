[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haradaer"
version = "1.0.0"
description = "Ferramenta de modelagem Entidade-Relacionamento compatível com o TerraER 3.14"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.12",
]

[project.scripts]
haradaer = "haradaer.gui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haradaer = ["resources/*.svg"]  # o ícone: a janela o usa, e o empacotamento gera os outros dele

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
